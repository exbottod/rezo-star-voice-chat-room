<script>
(function () {
  var msg = document.getElementById("bootmsg");
  var box = document.getElementById("booterr");
  window.__reactJalan = false;
  function tampilErr(t) {
    if (!box) return;
    box.style.display = "block";
    box.textContent = String(t).slice(0, 600);
  }
  window.__bootErr = tampilErr;
  window.__bootSelesai = function () {
    var b = document.getElementById("boot");
    if (b) b.remove();
  };
  window.onerror = function (m, src, l, c, e) {
    tampilErr("Error: " + m + "\n" + (src || "") + ":" + (l || 0) + "\n" + ((e && e.stack) || ""));
  };
  window.addEventListener("unhandledrejection", function (ev) {
    var r = ev.reason;
    tampilErr("Gagal: " + ((r && (r.message || r)) || "tidak diketahui"));
  });
  setTimeout(function () {
    if (!window.__reactJalan && msg) msg.textContent = "Masih memuat kode game... (" + location.host + ")";
  }, 4000);
  setTimeout(function () {
    if (!window.__reactJalan && msg) msg.textContent = "Kode game belum jalan. Halaman: " + location.href.slice(0, 90);
  }, 10000);
})();
</script>
