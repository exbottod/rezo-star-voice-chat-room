<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/images/icon.png" />
    <link rel="apple-touch-icon" href="./assets/images/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#C0392B" />
    <title>Greedy King</title>
    <script>
      // Di WebView Android, 100dvh/100vh kadang bernilai 0 sehingga seluruh isi
      // game tingginya nol dan yang terlihat hanya latar kuning. Tinggi layar
      // nyata dipasang langsung sebagai piksel lewat gaya inline.
      // Penting: tidak memakai MutationObserver. Mengubah elemen dari dalam
      // observer memicu observer itu lagi tanpa henti dan membekukan halaman.
      (function () {
        function paksa(el, h) {
          if (!el || !el.style) return;
          var v = h + "px";
          // Tulis hanya kalau berubah, supaya tidak memicu penggambaran ulang terus-menerus.
          if (el.style.getPropertyValue("height") !== v) {
            el.style.setProperty("height", v, "important");
            el.style.setProperty("min-height", v, "important");
          }
        }
        function tinggi() {
          var h = window.innerHeight || document.documentElement.clientHeight || 0;
          try { if (h < 100 && window.RezoBridge && window.RezoBridge.tinggi) h = Number(window.RezoBridge.tinggi()) || 0; } catch (e) {}
          if (h < 100) h = screen.height || 0;
          return h;
        }
        function pasang() {
          var h = tinggi();
          if (h < 100) return;
          paksa(document.documentElement, h);
          paksa(document.body, h);
          var akar = document.getElementById("root");
          paksa(akar, h);
          if (akar && akar.firstElementChild) paksa(akar.firstElementChild, h);
          var st = document.getElementById("gkTinggi");
          if (!st) {
            st = document.createElement("style");
            st.id = "gkTinggi";
            (document.head || document.documentElement).appendChild(st);
          }
          var css =
            "html,body,#root{height:" + h + "px!important;min-height:" + h + "px!important}" +
            ".h-dvh,.h-svh,.h-screen{height:" + h + "px!important}" +
            ".min-h-dvh,.min-h-svh,.min-h-screen{min-height:" + h + "px!important}";
          if (st.textContent !== css) st.textContent = css;
        }
        try { pasang(); } catch (e) {}
        // Ulangi beberapa detik pertama (React memasang isi setelah skrip ini), lalu berhenti.
        var n = 0;
        var ulang = setInterval(function () {
          try { pasang(); } catch (e) {}
          if (++n > 40) clearInterval(ulang);
        }, 250);
        window.addEventListener("resize", function () { try { pasang(); } catch (e) {} });
        window.addEventListener("load", function () { try { pasang(); } catch (e) {} });
      })();
    </script>

    <link rel="stylesheet" crossorigin href="./assets/index-C6zMQ3Ai.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
