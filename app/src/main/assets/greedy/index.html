<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Greedy King</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="bg-night text-cream">
<div id="root"></div>
<script>
window.__GREEDY_API__ = "__REZO_API__";
window.__GREEDY_TOKEN__ = "__REZO_TOKEN__";
window.__GREEDY_CHIPS__ = __REZO_CHIPS__;
window.__GREEDY_USER__ = { id: "__REZO_UID__", name: "__REZO_NAME__" };
window.__GK_SALAH__ = "";
window.onerror = function (m, s, l) {
  window.__GK_SALAH__ = m + " (baris " + l + ")";
  var d = document.getElementById("root");
  if (d) d.innerHTML = '<pre style="color:#ffcc88;padding:14px;font-size:12px;white-space:pre-wrap">' + window.__GK_SALAH__ + "</pre>";
};
window.addEventListener("unhandledrejection", function (e) {
  var t = (e && e.reason && (e.reason.message || e.reason)) || "promise gagal";
  window.__GK_SALAH__ = String(t);
  var d = document.getElementById("root");
  if (d && !d.innerHTML) d.innerHTML = '<pre style="color:#ffcc88;padding:14px;font-size:12px;white-space:pre-wrap">' + t + "</pre>";
});
</script>
<script src="bundle.js"></script>
</body>
</html>
