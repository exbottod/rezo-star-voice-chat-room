<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Greedy King</title>
<script>
(function () {
  var b = window.RezoBridge;
  function ambil(fn) { try { return b && b[fn] ? b[fn]() : ""; } catch (e) { return ""; } }
  window.__GREEDY_API__ = "https://43-156-99-4.sslip.io/greedy";
  window.__GREEDY_TOKEN__ = ambil("token") || window.__GREEDY_TOKEN__ || "";
  var uid = ambil("uid"), nama = ambil("nama");
  if (uid) window.__GREEDY_USER__ = { id: String(uid), name: String(nama || "Player") };
  var chip = ambil("chips"); if (chip) { try { window.__GREEDY_CHIPS__ = JSON.parse(chip); } catch (e) {} }
})();
</script>
  <script defer src="./assets/index-BJNBfRFH.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DX08ztSK.css">
</head>
<body>
<div id="boot" style="position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f7cf4a;color:#3a2b12;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px">
  <div style="font-size:46px;line-height:1">&#128081;</div>
  <div style="font-weight:800;font-size:19px;letter-spacing:.5px">GREEDY KING</div>
  <div id="bootmsg" style="font-size:13px;opacity:.75">Menyiapkan game...</div>
  <div id="booterr" style="display:none;font-size:11px;line-height:1.5;background:#fff;border:2px solid #b81f33;border-radius:12px;padding:10px 12px;max-width:100%;word-break:break-word;text-align:left"></div>
</div>
<script>
(function () {
  var msg = document.getElementById("bootmsg");
  var box = document.getElementById("booterr");
  window.__reactJalan = false;
  function tampilErr(t) {
    if (!box) return;
    box.style.display = "block";
    box.textContent = String(t).slice(0, 600);
  }
  window.__bootErr = tampilErr;
  // Layar muat hanya dicabut kalau game benar-benar sudah menggambar sesuatu.
  // Kalau dicabut terlalu cepat, layar jadi kuning kosong tanpa penjelasan.
  window.__bootSelesai = function () {
    var b = document.getElementById("boot");
    if (b) b.remove();
  };
  // Begitu game menggambar apa pun, layar muat dicabut sendiri. Jangan menunggu
  // panggilan dari dalam game, karena kalau game berhenti, layar muat menutupi
  // pesan aslinya dan yang terlihat cuma kuning.
  // Game dianggap benar-benar tampil hanya kalau ada kotak yang terlihat.
  // Kalau React sempat menempel tapi isinya kosong, layar muat DIBIARKAN,
  // supaya tidak pernah lagi jadi kuning polos tanpa tulisan.
  function sudahTampil() {
    var r = document.getElementById("root");
    if (!r) return false;
    var k = r.getBoundingClientRect();
    if (k.width > 120 && k.height > 200) return true;
    var anak = r.querySelectorAll("div,button,canvas,img,svg,span");
    for (var i = 0; i < anak.length; i++) {
      var q = anak[i].getBoundingClientRect();
      if (q.width > 100 && q.height > 100) return true;
    }
    return false;
  }
  var cek = setInterval(function () {
    if (sudahTampil()) {
      clearInterval(cek);
      window.__gkSudahTampil = true;
      var b = document.getElementById("boot");
      if (b) b.remove();
    }
  }, 300);
  window.onerror = function (m, src, l, c, e) {
    tampilErr("Error: " + m + "\n" + (src || "") + ":" + (l || 0) + "\n" + ((e && e.stack) || ""));
  };
  window.addEventListener("unhandledrejection", function (ev) {
    var r = ev.reason;
    tampilErr("Gagal: " + ((r && (r.message || r)) || "tidak diketahui"));
  });
  setTimeout(function () {
    if (!window.__reactJalan && msg) msg.textContent = "Masih memuat kode game... (" + location.host + ")";
  }, 4000);
  setTimeout(function () {
    if (!window.__reactJalan && msg) msg.textContent = "Kode game belum jalan. Halaman: " + location.href.slice(0, 90);
  }, 10000);
})();
</script>


<div id="gksebab" style="display:none;position:fixed;inset:0;z-index:2147483647;background:#fbdb2e;color:#3a2b12;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:22px;overflow:auto">
  <div style="font-size:22px;font-weight:800;margin-bottom:10px">Game belum bisa jalan</div>
  <div id="gksebabisi" style="font-size:12px;line-height:1.6;background:#fff;border:2px solid #b81f33;border-radius:12px;padding:12px;word-break:break-word;white-space:pre-wrap"></div>
  <button id="gkcobaLagi" style="margin-top:14px;width:100%;padding:14px;border:0;border-radius:12px;background:#b81f33;color:#fff;font-size:15px;font-weight:700">Coba lagi</button>
</div>
<script>
(function () {
  var panel = document.getElementById("gksebab");
  var isi = document.getElementById("gksebabisi");
  var pesanAkhir = "";
  function catat(t) { pesanAkhir = String(t || "").slice(0, 400); }
  window.addEventListener("error", function (e) { catat("Error: " + (e.message || "") ); });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason; catat("Gagal: " + ((r && (r.message || r)) || "tidak diketahui"));
  });
  function tampilSebab(asli) {
    var b = window.RezoBridge;
    function ambil(fn) { try { return b && b[fn] ? b[fn]() : null; } catch (e) { return "gagal"; } }
    var uid = ambil("uid"), tok = ambil("token");
    var baris = [
      "Penyebab: " + (asli || pesanAkhir || "kode game berhenti tanpa pesan"),
      "",
      "Alamat halaman: " + location.href.slice(0, 90),
      "Jembatan app (RezoBridge): " + (b ? "ada" : "tidak ada"),
      "ID pemain: " + (uid ? "ada (" + String(uid).slice(0, 12) + ")" : "kosong"),
      "Token: " + (tok ? "ada (" + String(tok).length + " huruf)" : "kosong"),
      "Isi layar: " + (document.getElementById("root") ? document.getElementById("root").children.length + " bagian" : "tidak ada"),
    ];
    isi.textContent = baris.join("\n");
    panel.style.display = "block";
    var boot = document.getElementById("boot");
    if (boot) boot.remove();
  }
  window.__gkSebab = tampilSebab;
  document.getElementById("gkcobaLagi").onclick = function () { location.reload(); };
  // Kalau game tidak menggambar apa pun, tampilkan penyebabnya, bukan layar kuning kosong.
  setTimeout(function () {
    if (!window.__gkSudahTampil) {
      tampilSebab(pesanAkhir || "kode game berhenti sebelum menggambar apa pun (12 detik)");
    }
  }, 12000);
})();
</script>

<div id="root"></div>
</body>
</html>
