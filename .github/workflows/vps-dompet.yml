name: Perbarui kode dompet VPS
on:
  workflow_dispatch:
jobs:
  perbarui:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang kunci layanan Firebase Viza
        env:
          PASS: ${{ secrets.VPS_PASSWORD || secrets.VPS_PASSWORDS || secrets.VPS_PASS || secrets.VPS_ROOT_PASSWORD }}
          SA: ${{ secrets.VIZA_FIREBASE_SA }}
        run: |
          set -u
          if [ -z "${SA:-}" ]; then echo "::warning::Kunci Firebase Viza belum ada di secrets, dilewati"; exit 0; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ALAMAT=43.156.99.4
          OPSI="-o StrictHostKeyChecking=no -o ConnectTimeout=25 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          B64=$(printf '%s' "$SA" | base64 -w0)
          PERINTAH="mkdir -p /opt/viza-api && echo $B64 | base64 -d > /opt/viza-api/firebase-sa.json && chmod 600 /opt/viza-api/firebase-sa.json && echo kunci-terpasang"
          if sshpass -p "$PASS" ssh $OPSI root@$ALAMAT "$PERINTAH"; then
            echo "kunci dipasang sebagai root"
          elif printf '%s\n' "$PASS" | sshpass -p "$PASS" ssh $OPSI ubuntu@$ALAMAT "sudo -S -p '' bash -c '$PERINTAH'"; then
            echo "kunci dipasang sebagai ubuntu"
          else
            echo "::warning::Kunci Firebase gagal dipasang, dilewati"
          fi

      - name: Sambung ke VPS dan jalankan update.sh
        env:
          PASS: ${{ secrets.VPS_PASSWORD || secrets.VPS_PASSWORDS || secrets.VPS_PASS || secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -u
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ALAMAT=43.156.99.4
          SKRIP=https://raw.githubusercontent.com/exbottod/rezo-star-voice-chat-room/main/vps/update.sh
          OPSI="-o StrictHostKeyChecking=no -o ConnectTimeout=25 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          if [ -z "${PASS}" ]; then echo "::error::Secret password VPS belum ada."; exit 1; fi
          echo "== Mencoba user root"
          if sshpass -p "$PASS" ssh $OPSI root@$ALAMAT "bash -c 'curl -fsSL $SKRIP | bash'"; then
            echo "Selesai sebagai root."; exit 0
          fi
          echo "::warning::Login root gagal, mencoba user ubuntu dengan sudo."
          if printf '%s\n' "$PASS" | sshpass -p "$PASS" ssh $OPSI ubuntu@$ALAMAT "sudo -S -p '' bash -c 'curl -fsSL $SKRIP | bash'"; then
            echo "Selesai sebagai ubuntu."; exit 0
          fi
          echo "::error::Kedua cara login gagal."
          exit 1
